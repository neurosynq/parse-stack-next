name: Release Gem

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # Fail closed unless the exact commit being released has been validated.
  # Publication (`push` below) depends on this job, so a release cut from an
  # untested commit, or from a commit whose CI failed, never reaches RubyGems.
  validate:
    name: Validate release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches lib/parse/stack/version.rb
        if: github.event_name == 'release'
        run: |
          version=$(ruby -e 'require "./lib/parse/stack/version"; print Parse::Stack::VERSION')
          tag="${GITHUB_REF_NAME}"
          if [ "${tag}" != "v${version}" ]; then
            echo "::error::Release tag ${tag} does not match version.rb (v${version})."
            exit 1
          fi

      - name: Gem Tests passed on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # The LATEST completed Gem Tests (ruby.yml) run for this SHA must have
          # succeeded. A latest run (or rerun) that failed fails the release; an
          # older success does not outweigh a newer failure.
          #
          # A release published right after its merge commit lands starts
          # before Gem Tests on that commit has been created or has finished.
          # Wait up to 45 minutes (a Gem Tests run usually takes 10 to 30) for
          # a run to exist and for every run on the SHA to complete, then judge
          # the latest completed one. Timing out with a run still unfinished
          # fails the release instead of judging an older completed run.
          runs_url="repos/${GITHUB_REPOSITORY}/actions/workflows/ruby.yml/runs?head_sha=${SHA}&per_page=50"
          deadline=$(( $(date +%s) + 2700 ))
          while :; do
            # A failed API call is retried on the next poll rather than
            # aborting the step.
            counts=$(gh api "${runs_url}" \
              --jq '[(.workflow_runs | length), ([.workflow_runs[] | select(.status != "completed")] | length)] | @tsv') || counts=""
            total=$(cut -f1 <<<"${counts}")
            pending=$(cut -f2 <<<"${counts}")
            total=${total:-0}
            pending=${pending:-1}
            if [ -n "${counts}" ] && [ "${total}" -gt 0 ] && [ "${pending}" -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Timed out waiting for Gem Tests on ${SHA} (runs: ${total}, unfinished: ${pending}). Wait for CI on this commit, then re-run this workflow."
              exit 1
            fi
            echo "Waiting for Gem Tests on ${SHA} (runs: ${total}, unfinished: ${pending})..."
            sleep 30
          done
          latest=$(gh api "${runs_url}" \
            --jq '[.workflow_runs[] | select(.status == "completed")] | sort_by(.updated_at) | last | .conclusion // "none"')
          echo "Latest completed Gem Tests conclusion for ${SHA}: ${latest}"
          if [ "${latest}" != "success" ]; then
            echo "::error::The latest Gem Tests run for ${SHA} did not succeed (${latest}). Wait for CI on this commit, or fix it, before releasing."
            exit 1
          fi

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Re-run the unit suite on the exact commit being packaged, so the gem
      # built below is the code that was just tested here.
      - name: Unit tests on the release commit
        run: bundle exec rake test:unit

  push:
    name: Push to RubyGems
    needs: validate
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      # Credentials stay persisted here: `rake release` (via
      # rubygems/release-gem) pushes the version tag with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bundler-cache (next step) writes --local path / --local
      # deployment into the tracked `.bundle/config`, which would leave
      # the working tree dirty and trip `rake release`'s
      # `release:guard_clean` check. Tell git to ignore worktree
      # mutations to this file so guard_clean passes while still
      # letting Bundler resolve vendor/bundle in the next step.
      - run: git update-index --skip-worktree .bundle/config

      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1

      # Mirror the same .gem to GitHub Packages. The previous step
      # leaves the built artifact in pkg/parse-stack-next-X.Y.Z.gem
      # (rake build's output dir). GitHub Packages auth uses the
      # workflow's GITHUB_TOKEN as a Bearer credential via the
      # GEM_HOST_API_KEY env var — no separate PAT needed.
      - name: Push to GitHub Packages
        env:
          GEM_HOST_API_KEY: "Bearer ${{ secrets.GITHUB_TOKEN }}"
        run: gem push --host "https://rubygems.pkg.github.com/${{ github.repository_owner }}" pkg/*.gem
